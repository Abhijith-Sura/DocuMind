version: "3.9"

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: documind_postgres
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery Broker) ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: documind_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: documind_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://documind:documind@postgres:5432/documind_db
      - REDIS_URL=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker (Background Tasks) ──────────────────────────────────
  celery_worker:
    build: ./backend
    container_name: documind_celery
    command: celery -A app.tasks.document_tasks.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://documind:documind@postgres:5432/documind_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
    depends_on:
      - backend
      - redis

  # ── Celery Flower (Task Monitor) ───────────────────────────────────────
  flower:
    build: ./backend
    container_name: documind_flower
    command: celery -A app.tasks.document_tasks.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - celery_worker

  # ── MLflow Tracking Server ─────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: documind_mlflow
    command: >
      bash -c "pip install mlflow psycopg2-binary &&
               python -c \"import psycopg2; c=psycopg2.connect(host='postgres',user='documind',password='documind',dbname='documind_db'); c.autocommit=True; c.cursor().execute('CREATE DATABASE mlflow_db')\" 2>/dev/null || true &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri postgresql://documind:documind@postgres:5432/mlflow_db
               --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  # ── Next.js Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: documind_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
  chroma_data:
  mlflow_data:
